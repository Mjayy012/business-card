<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact editor test</title>
    <style>
      body { box-sizing: border-box; min-height: 100vh; margin: 0; padding: 24px; display: grid; place-items: center; background: #0b1430; color: #f8f7f2; font: 16px/1.5 system-ui, sans-serif; }
      main { width: min(100%, 420px); }
      h1 { font-size: 26px; line-height: 1.2; }
      p { color: #d4dcec; }
      button { width: 100%; min-height: 52px; border: 0; border-radius: 14px; background: #ffc24b; color: #101827; font: 800 16px system-ui, sans-serif; }
      #status { min-height: 3em; }
    </style>
  </head>
  <body>
    <main>
      <h1>Test the New contact screen</h1>
      <p>On Android Chrome, tap below. Check whether the Contacts app opens with Mark jay Bares, the phone number, and email already filled in. Nothing is saved unless you confirm it there.</p>
      <button type="button" onclick="addContact()">Open New contact</button>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="config.js?v=20261118-14"></script>
    <script>
      function addContact() {
        const name = me.first + " " + me.last;
        const phone = me.phone;
        const email = me.email;

        const intent =
          "intent:#Intent;" +
          "action=android.intent.action.INSERT;" +
          "type=vnd.android.cursor.dir/contact;" +
          "S.name=" + encodeURIComponent(name) + ";" +
          "S.phone=" + encodeURIComponent(phone) + ";" +
          "S.email=" + encodeURIComponent(email) + ";" +
          "end";

        document.getElementById("status").textContent = "Trying to open the contact editor…";
        window.location.href = intent;
        setTimeout(() => {
          if (!document.hidden) {
            document.getElementById("status").textContent =
              "If the New contact screen did not open, tell me what appeared instead.";
          }
        }, 1500);
      }
    </script>
  </body>
</html>
