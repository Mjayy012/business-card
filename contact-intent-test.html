<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Add to Contacts</title>
    <style>
      :root {
        --bg: #f3f6f4;
        --card: #ffffff;
        --ink: #14231c;
        --muted: #5b6b63;
        --line: #cfd9d3;
        --accent: #1f6f4a;
        --accent-ink: #ffffff;
        --err: #b3261e;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #101713;
          --card: #18221c;
          --ink: #e8f0ec;
          --muted: #9bb0a5;
          --line: #2c3a32;
          --accent: #5cc796;
          --accent-ink: #0b1a12;
          --err: #ff8a80;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
        background: var(--bg);
        color: var(--ink);
        font:
          16px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 24px;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 1.4rem;
      }
      p.sub {
        margin: 0 0 20px;
        color: var(--muted);
        font-size: 0.95rem;
      }
      label {
        display: block;
        margin: 14px 0 4px;
        font-size: 0.9rem;
        font-weight: 600;
      }
      input {
        width: 100%;
        padding: 12px;
        font: inherit;
        color: var(--ink);
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      input:focus-visible,
      button:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }
      button {
        width: 100%;
        margin-top: 22px;
        padding: 14px;
        font: inherit;
        font-weight: 700;
        color: var(--accent-ink);
        background: var(--accent);
        border: 0;
        border-radius: 8px;
        cursor: pointer;
      }
      #msg {
        min-height: 1.4em;
        margin: 12px 0 0;
        font-size: 0.9rem;
        color: var(--muted);
      }
      #msg.error {
        color: var(--err);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Add to Contacts</h1>
      <p class="sub">
        Enter the details, then tap the button to save them to your phone.
      </p>

      <form id="contactForm" novalidate>
        <label for="first">First name</label>
        <input id="first" autocomplete="given-name" required />

        <label for="last">Last name</label>
        <input id="last" autocomplete="family-name" />

        <label for="phone">Phone</label>
        <input id="phone" type="tel" autocomplete="tel" inputmode="tel" />

        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" />

        <label for="org">Company (optional)</label>
        <input id="org" autocomplete="organization" />

        <button type="submit">Add to Contacts</button>
        <p id="msg" role="status"></p>
      </form>
    </main>

    <script>
      const form = document.getElementById("contactForm");
      const msg = document.getElementById("msg");

      // Escape characters that have special meaning in vCard values
      const esc = (s) =>
        s
          .replace(/\\/g, "\\\\")
          .replace(/\n/g, "\\n")
          .replace(/,/g, "\\,")
          .replace(/;/g, "\\;");

      function buildVCard(d) {
        const lines = [
          "BEGIN:VCARD",
          "VERSION:3.0",
          `N:${esc(d.last)};${esc(d.first)};;;`,
          `FN:${esc((d.first + " " + d.last).trim())}`,
        ];
        if (d.org) lines.push(`ORG:${esc(d.org)}`);
        if (d.phone) lines.push(`TEL;TYPE=CELL:${d.phone}`);
        if (d.email) lines.push(`EMAIL;TYPE=INTERNET:${d.email}`);
        lines.push("END:VCARD");
        return lines.join("\r\n");
      }

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const d = {
          first: form.first.value.trim(),
          last: form.last.value.trim(),
          phone: form.phone.value.trim(),
          email: form.email.value.trim(),
          org: form.org.value.trim(),
        };

        msg.className = "";
        if (!d.first && !d.last) {
          msg.className = "error";
          msg.textContent = "Enter at least a first or last name.";
          return;
        }
        if (!d.phone && !d.email) {
          msg.className = "error";
          msg.textContent = "Enter a phone number or an email.";
          return;
        }

        if (/Android/i.test(navigator.userAgent)) {
          // Android: open the Contacts app's "New contact" screen directly
          const fullName = (d.first + " " + d.last).trim();
          const extras = [
            ["name", fullName],
            ["phone", d.phone],
            ["email", d.email],
            ["company", d.org],
          ]
            .filter(([, v]) => v)
            .map(([k, v]) => `S.${k}=${encodeURIComponent(v)}`)
            .join(";");
          window.location.href = `intent:#Intent;action=android.intent.action.INSERT;type=vnd.android.cursor.dir/contact;${extras};end`;
          msg.textContent = "Opening Contacts… tap the checkmark to save.";
          return;
        }

        // Other devices (iPhone, desktop): fall back to a vCard file
        const blob = new Blob([buildVCard(d)], {
          type: "text/vcard;charset=utf-8",
        });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download =
          ((d.first + "-" + d.last).replace(/[^\w-]+/g, "") || "contact") +
          ".vcf";
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 10000);
        msg.textContent = "Open the downloaded file to add the contact.";
      });
    </script>
  </body>
</html>
